<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1520" viewBox="0 0 2560 1520">
<rect width="2560" height="1520" fill="#05070d"/>
<defs><pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#0b1220" stroke-width="1"/></pattern></defs>
<rect width="2560" height="1520" fill="url(#grid)"/>
<text x="90" y="83" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" fill="#f2f6fc" text-anchor="start" letter-spacing="6">FUSE_BOX GUARDIAN</text>
<text x="90" y="173" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="86" font-weight="700" fill="#f2f6fc" text-anchor="start">Set up in minutes</text>
<text x="90" y="242" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="37" font-weight="400" fill="#93a4bb" text-anchor="start">The box arrives built and running. What she does is plug in three cords and flip one switch.</text>
<rect x="90" y="300" width="570" height="300" rx="22" fill="#0a101c" stroke="#2fe6c8" stroke-width="2"/>
<text x="120" y="362" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="48" font-weight="700" fill="#2fe6c8" text-anchor="start">1</text>
<text x="120" y="429" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="31" font-weight="700" fill="#f2f6fc" text-anchor="start">PLUG IN THE BOX</text>
<text x="120" y="478" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">Power cord — and the TV if she</text>
<text x="120" y="518" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">wants the big screen. It boots</text>
<text x="120" y="558" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">itself straight to the board.</text>
<rect x="693" y="300" width="570" height="300" rx="22" fill="#0a101c" stroke="#35b6f2" stroke-width="2"/>
<text x="723" y="362" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="48" font-weight="700" fill="#35b6f2" text-anchor="start">2</text>
<text x="723" y="429" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="31" font-weight="700" fill="#f2f6fc" text-anchor="start">JOIN THE WI-FI</text>
<text x="723" y="478" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">Settings lives on the board itself,</text>
<text x="723" y="518" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">typed on its own pop-up keyboard.</text>
<text x="723" y="558" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">Nothing else to install.</text>
<rect x="1296" y="300" width="570" height="300" rx="22" fill="#0a101c" stroke="#b07fe8" stroke-width="2"/>
<text x="1326" y="362" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="48" font-weight="700" fill="#b07fe8" text-anchor="start">3</text>
<text x="1326" y="429" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="31" font-weight="700" fill="#f2f6fc" text-anchor="start">PLUG IN THE PHONE</text>
<text x="1326" y="478" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">Her phone cord goes into the small</text>
<text x="1326" y="518" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">adapter. The box finds it, adds it,</text>
<text x="1326" y="558" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">and programs it for her.</text>
<rect x="1899" y="300" width="570" height="300" rx="22" fill="#0a101c" stroke="#f5b93f" stroke-width="2"/>
<text x="1929" y="362" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="48" font-weight="700" fill="#f5b93f" text-anchor="start">4</text>
<text x="1929" y="429" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="31" font-weight="700" fill="#f2f6fc" text-anchor="start">FLIP THE SWITCH</text>
<text x="1929" y="478" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">One switch on the board:</text>
<text x="1929" y="518" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">GUARDIAN — ON. From that moment,</text>
<text x="1929" y="558" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="25" font-weight="400" fill="#93a4bb" text-anchor="start">her calls and screens are watched.</text>
<rect x="542" y="340" width="36" height="44" rx="6" fill="none" stroke="#2fe6c8" stroke-width="4"/>
<line x1="550" y1="324" x2="550" y2="340" stroke="#2fe6c8" stroke-width="4"/>
<line x1="570" y1="324" x2="570" y2="340" stroke="#2fe6c8" stroke-width="4"/>
<path d="M 534 397 A 26 21 0 0 0 586 397" fill="none" stroke="#2fe6c8" stroke-width="4"/>
<path d="M 1163 384 A 18 18 0 0 1 1199 384" fill="none" stroke="#35b6f2" stroke-width="4"/>
<path d="M 1149 384 A 32 32 0 0 1 1213 384" fill="none" stroke="#35b6f2" stroke-width="4"/>
<path d="M 1135 384 A 46 46 0 0 1 1227 384" fill="none" stroke="#35b6f2" stroke-width="4"/>
<circle cx="1181" cy="384" r="6" fill="#35b6f2"/>
<rect x="1740" y="330" width="88" height="52" rx="8" fill="none" stroke="#b07fe8" stroke-width="4"/>
<circle cx="1784" cy="356" r="18" fill="none" stroke="#b07fe8" stroke-width="3"/>
<rect x="2335" y="332" width="104" height="54" rx="27" fill="none" stroke="#f5b93f" stroke-width="4"/>
<circle cx="2408" cy="359" r="19" fill="#34d399"/>
<rect x="90" y="650" width="2380" height="440" rx="22" fill="#0a101c" stroke="#4a86ff" stroke-width="2"/>
<text x="128" y="703" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="31" font-weight="700" fill="#4a86ff" text-anchor="start" letter-spacing="3">THE PC: ONE DOUBLE-CLICK</text>
<rect x="128" y="740" width="1050" height="300" rx="12" fill="#0d1622" stroke="#3a5878" stroke-width="3"/>
<rect x="128" y="740" width="1050" height="54" rx="12" fill="#16222f"/>
<rect x="128" y="770" width="1050" height="24" rx="0" fill="#16222f"/>
<text x="152" y="771" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#f2f6fc" text-anchor="start">Network</text>
<circle cx="1089" cy="767" r="7" fill="none" stroke="#93a4bb" stroke-width="2"/>
<circle cx="1123" cy="767" r="7" fill="none" stroke="#93a4bb" stroke-width="2"/>
<circle cx="1157" cy="767" r="7" fill="none" stroke="#93a4bb" stroke-width="2"/>
<text x="152" y="831" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="700" fill="#35b6f2" text-anchor="start">Network  &gt;  FUSEBOX</text>
<rect x="190" y="858" width="96" height="118" rx="6" fill="none" stroke="#f5b93f" stroke-width="4"/>
<polygon points="286,858 260,858 286,884" fill="none" stroke="#f5b93f" stroke-width="3"/>
<text x="238" y="1004" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="700" fill="#f2f6fc" text-anchor="middle">Install PC Guardian.bat</text>
<circle cx="320" cy="900" r="12" fill="none" stroke="#f2f6fc" stroke-width="2"/>
<circle cx="320" cy="900" r="20" fill="none" stroke="#6b7d94" stroke-width="2"/>
<polygon points="322,904 322,962 341,946 353,974 365,967 353,940 376,940" fill="#f2f6fc"/>
<text x="1260" y="778" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2f6fc" text-anchor="start">She doesn't type a single command.</text>
<text x="1260" y="829" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#93a4bb" text-anchor="start">On her computer she opens the network, sees the</text>
<text x="1260" y="869" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#93a4bb" text-anchor="start">box by name — FUSEBOX — and double-clicks the</text>
<text x="1260" y="909" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#93a4bb" text-anchor="start">one file sitting there. The file comes from the</text>
<text x="1260" y="949" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#93a4bb" text-anchor="start">box itself, not from the internet.</text>
<text x="1260" y="1007" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#2fe6c8" text-anchor="start">About a minute later, her PC appears on the Guardian</text>
<text x="1260" y="1045" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="700" fill="#2fe6c8" text-anchor="start">screen — watched over, banner rules and all.</text>
<rect x="90" y="1130" width="2380" height="280" rx="22" fill="#0a101c" stroke="#34d399" stroke-width="2"/>
<text x="128" y="1183" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="31" font-weight="700" fill="#34d399" text-anchor="start" letter-spacing="3">THAT'S THE WHOLE SETUP</text>
<circle cx="148" cy="1246" r="20" fill="none" stroke="#34d399" stroke-width="4"/>
<polyline points="139,1246 146,1254 158,1236" fill="none" stroke="#34d399" stroke-width="4"/>
<text x="186" y="1254" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2f6fc" text-anchor="start">Phones watched</text>
<circle cx="820" cy="1246" r="20" fill="none" stroke="#34d399" stroke-width="4"/>
<polyline points="811,1246 818,1254 830,1236" fill="none" stroke="#34d399" stroke-width="4"/>
<text x="858" y="1254" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2f6fc" text-anchor="start">PC watched</text>
<circle cx="1492" cy="1246" r="20" fill="none" stroke="#34d399" stroke-width="4"/>
<polyline points="1483,1246 1490,1254 1502,1236" fill="none" stroke="#34d399" stroke-width="4"/>
<text x="1530" y="1254" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2f6fc" text-anchor="start">Guardian ON</text>
<text x="128" y="1347" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="400" fill="#93a4bb" text-anchor="start">And if the box ever goes dark, her phones keep ringing — setup never becomes a single point of failure.</text>
<text x="90" y="1483" font-family="'Liberation Sans','Segoe UI',Arial,sans-serif" font-size="23" font-weight="700" fill="#6b7d94" text-anchor="start" letter-spacing="3">NO ACCOUNTS  •  NO COMMANDS  •  NO SETUP SCREENS</text>
</svg>
